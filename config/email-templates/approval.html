<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}}</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      line-height: 1.6;
      color: #333;
      max-width: 680px;
      margin: 0 auto;
      padding: 20px;
      background-color: #f5f5f5;
    }
    .container {
      background-color: #ffffff;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .header {
      text-align: center;
      border-bottom: 2px solid #000;
      padding-bottom: 20px;
      margin-bottom: 30px;
    }
    .header h1 {
      margin: 0 0 10px 0;
      font-size: 2em;
      font-weight: 700;
    }
    .header h2 {
      margin: 0;
      font-size: 1.2em;
      font-weight: 400;
      color: #666;
    }
    .content {
      font-size: 1.1em;
      margin-bottom: 40px;
    }
    .content p {
      margin: 1.2em 0;
    }
    .approval-section {
      background-color: #f0f0f0;
      padding: 30px;
      border-radius: 8px;
      text-align: center;
      margin-top: 40px;
    }
    .approval-code {
      background-color: #000;
      color: #fff;
      padding: 15px 30px;
      font-family: 'Courier New', monospace;
      font-size: 1.5em;
      font-weight: bold;
      display: inline-block;
      border-radius: 4px;
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>{{title}}</h1>
      <h2>{{subtitle}}</h2>
    </div>
    <div class="content">
      {{content}}
    </div>
    <div class="approval-section">
      <h3>📝 Reply with:</h3>
      <div class="approval-code">poste</div>
    </div>
  </div>
</body>
</html>
